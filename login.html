<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BlogSpace | Login</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="auth-page">


    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html"
           class="logo">

            BlogSpace

        </a>


        <nav class="nav-links"
             id="navLinks">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#blogs">
                Blogs
            </a>

            <a href="register.html"
               class="register-btn">

                Register

            </a>

        </nav>


        <button class="menu-btn"
                onclick="toggleMenu()">

            ☰

        </button>

    </header>


    <!-- LOGIN -->

    <main class="auth-container">

        <div class="auth-card">


            <div class="auth-header">

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to continue to BlogSpace.
                </p>

            </div>


            <form id="loginForm">


                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required>

                </div>


                <div class="remember-row">

                    <label>

                        <input
                            type="checkbox"
                            id="rememberMe">

                        Remember Me

                    </label>

                </div>


                <button type="submit"
                        class="form-btn">

                    Login

                </button>


                <p id="loginMessage"
                   class="form-message">
                </p>


            </form>


            <div class="auth-bottom">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create Account
                    </a>
                </p>

            </div>


        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
