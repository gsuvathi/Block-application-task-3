<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>BlogSpace | Dashboard</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

<nav class="navbar">

    <a href="index.html" class="logo">
        BlogSpace
    </a>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="dashboard.html" class="active">
            Dashboard
        </a>

        <a
            href="create-blog.html"
            class="nav-button">
            Create Blog
        </a>

        <a
            href="#"
            onclick="logoutUser(); return false;">
            Logout
        </a>

    </div>

</nav>


<main class="dashboard-container">

    <section class="dashboard-header">

        <div>

            <p class="eyebrow">
                YOUR ACCOUNT
            </p>

            <h1>
                Dashboard
            </h1>

            <p
                id="welcomeUser"
                class="subtitle">
                Welcome back!
            </p>

        </div>


        <a
            href="create-blog.html"
            class="primary-btn">

            + Create Blog

        </a>

    </section>


    <section class="stats-grid">

        <div class="stat-card">

            <div class="stat-icon">
                📝
            </div>

            <div>

                <h2 id="totalBlogs">
                    0
                </h2>

                <p>
                    Total Blogs
                </p>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                👁️
            </div>

            <div>

                <h2>
                    0
                </h2>

                <p>
                    Total Views
                </p>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                ❤️
            </div>

            <div>

                <h2>
                    0
                </h2>

                <p>
                    Likes
                </p>

            </div>

        </div>

    </section>


    <section class="blogs-section">

        <div class="section-header">

            <div>

                <p class="eyebrow">
                    YOUR CONTENT
                </p>

                <h2>
                    My Blogs
                </h2>

            </div>


            <input
                type="text"
                id="searchBlogs"
                placeholder="Search blogs..."
                oninput="searchBlogs()">

        </div>


        <div id="dashboardBlogList">

        </div>

    </section>

</main>


<script src="js/script.js"></script>

</body>

</html>
