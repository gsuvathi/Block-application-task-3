<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BlogSpace | Dashboard</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html"
           class="logo">

            BlogSpace

        </a>


        <nav class="nav-links"
             id="navLinks">

            <a href="index.html">
                Home
            </a>

            <a href="dashboard.html"
               class="active">

                Dashboard

            </a>

            <a href="create-blog.html"
               class="register-btn">

                Create Blog

            </a>

            <a href="#"
               onclick="logoutUser()">

                Logout

            </a>

        </nav>


        <button class="menu-btn"
                onclick="toggleMenu()">

            ☰

        </button>

    </header>


    <!-- DASHBOARD -->

    <main class="dashboard">

        <div class="dashboard-header">

            <div>

                <p class="small-title">
                    YOUR ACCOUNT
                </p>

                <h1>
                    Dashboard
                </h1>

                <p id="welcomeUser">
                    Welcome back!
                </p>

            </div>


            <a href="create-blog.html"
               class="primary-btn">

                + Create Blog

            </a>

        </div>


        <!-- STATS -->

        <section class="stats-grid">

            <div class="stat-card">

                <div class="stat-icon">
                    📝
                </div>

                <div>

                    <h3 id="totalBlogs">
                        0
                    </h3>

                    <p>
                        Total Blogs
                    </p>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    👁️
                </div>

                <div>

                    <h3>
                        0
                    </h3>

                    <p>
                        Total Views
                    </p>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ❤️
                </div>

                <div>

                    <h3>
                        0
                    </h3>

                    <p>
                        Likes
                    </p>

                </div>

            </div>

        </section>


        <!-- BLOG SECTION -->

        <section class="dashboard-blogs">

            <div class="dashboard-title">

                <h2>
                    My Blogs
                </h2>

                <input
                    type="text"
                    id="searchBlogs"
                    placeholder="Search blogs..."
                    onkeyup="searchBlogs()">

            </div>


            <div id="dashboardBlogList"
                 class="dashboard-blog-list">

            </div>

        </section>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
