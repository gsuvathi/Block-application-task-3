<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BlogSpace - Blog Details</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html" class="logo">
            BlogSpace
        </a>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="blog.html">
                Blogs
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="create-blog.html">
                Create Blog
            </a>

            <a href="#" onclick="logoutUser()">
                Logout
            </a>

        </nav>

    </header>


    <!-- BLOG DETAILS -->

    <main class="container">

        <article
            id="blogDetails"
            class="blog-details"
        >

            <p>
                Loading blog...
            </p>

        </article>

    </main>


    <script>

        async function loadBlogDetails() {

            const container =
                document.getElementById("blogDetails");


            // Get ID from URL

            const params =
                new URLSearchParams(
                    window.location.search
                );


            const blogId =
                params.get("id");


            if (!blogId) {

                container.innerHTML =
                    "<h2>Blog not found</h2>";

                return;
            }


            try {

                const response =
                    await fetch(
                        "/api/blogs/" + blogId
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    container.innerHTML =
                        "<h2>Blog not found</h2>";

                    return;
                }


                const blog =
                    data.blog;


                if (!blog) {

                    container.innerHTML =
                        "<h2>Blog not found</h2>";

                    return;
                }


                const title =
                    document.createElement("h1");

                title.textContent =
                    blog.title;


                const author =
                    document.createElement("p");

                author.className =
                    "blog-author";

                author.textContent =
                    blog.author
                        ? "By " + blog.author.name
                        : "By Unknown";


                const date =
                    document.createElement("small");

                if (blog.createdAt) {

                    date.textContent =
                        new Date(
                            blog.createdAt
                        ).toLocaleDateString();

                }


                const content =
                    document.createElement("div");

                content.className =
                    "blog-content";

                content.textContent =
                    blog.content;


                const back =
                    document.createElement("a");

                back.href =
                    "blog.html";

                back.textContent =
                    "← Back to Blogs";

                back.className =
                    "read-more";


                container.innerHTML = "";


                container.appendChild(title);

                container.appendChild(author);

                container.appendChild(date);

                container.appendChild(content);

                container.appendChild(back);


            } catch (error) {

                console.error(
                    "Error loading blog:",
                    error
                );


                container.innerHTML =
                    "<h2>Unable to connect to server</h2>";
            }

        }


        function logoutUser() {

            localStorage.removeItem("token");

            localStorage.removeItem("currentUser");

            window.location.href =
                "index.html";

        }


        loadBlogDetails();

    </script>

</body>

</html>
