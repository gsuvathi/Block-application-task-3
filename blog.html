<form id="createBlogForm">

    <label>Blog Title</label>

    <input
        type="text"
        id="blogTitle"
        placeholder="Enter blog title"
        required
    >


    <label>Blog Content</label>

    <textarea
        id="blogContent"
        placeholder="Write your blog..."
        required
    ></textarea>


    <p id="blogMessage"></p>


    <button
        type="submit"
        id="createBlogButton"
    >
        Publish Blog
    </button>

</form>
