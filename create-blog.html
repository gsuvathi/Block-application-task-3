<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BlogSpace | Create Blog</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html"
           class="logo">

            BlogSpace

        </a>


        <nav class="nav-links"
             id="navLinks">

            <a href="index.html">
                Home
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="create-blog.html"
               class="active">

                Create Blog

            </a>

        </nav>


        <button class="menu-btn"
                onclick="toggleMenu()">

            ☰

        </button>

    </header>


    <!-- CREATE BLOG -->

    <main class="create-container">

        <div class="create-header">

            <p class="small-title">
                BLOG EDITOR
            </p>

            <h1>
                Create New Blog
            </h1>

            <p>
                Share your ideas and stories with the world.
            </p>

        </div>


        <form id="blogForm"
              class="blog-form">


            <div class="form-group">

                <label for="blogTitle">
                    Blog Title
                </label>

                <input
                    type="text"
                    id="blogTitle"
                    placeholder="Enter your blog title"
                    required>

            </div>


            <div class="form-group">

                <label for="blogCategory">
                    Category
                </label>

                <select id="blogCategory"
                        required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Development">
                        Development
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Career">
                        Career
                    </option>

                    <option value="Lifestyle">
                        Lifestyle
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="blogContent">
                    Blog Content
                </label>

                <textarea
                    id="blogContent"
                    rows="12"
                    placeholder="Write your blog content here..."
                    required></textarea>

            </div>


            <div class="editor-actions">

                <a href="dashboard.html"
                   class="secondary-btn">

                    Cancel

                </a>

                <button type="submit"
                        class="form-btn">

                    Publish Blog

                </button>

            </div>


            <p id="blogMessage"
               class="form-message">
            </p>


        </form>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
