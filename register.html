<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BlogSpace | Register</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="auth-page">


    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html" class="logo">
            BlogSpace
        </a>

        <nav class="nav-links" id="navLinks">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#blogs">
                Blogs
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="register.html"
               class="register-btn">
                Register
            </a>

        </nav>

        <button class="menu-btn"
                onclick="toggleMenu()">
            ☰
        </button>

    </header>


    <!-- REGISTER -->

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-header">

                <h1>
                    Create Account
                </h1>

                <p>
                    Join BlogSpace and start sharing your stories.
                </p>

            </div>


            <form id="registerForm">


                <div class="form-group">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        required>

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Enter password"
                        required>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        required>

                </div>


                <button type="submit"
                        class="form-btn">

                    Create Account

                </button>


                <p id="registerMessage"
                   class="form-message">
                </p>


            </form>


            <div class="auth-bottom">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
